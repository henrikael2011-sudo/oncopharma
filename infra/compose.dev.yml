services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oncopharma_dev
      POSTGRES_USER: oncopharma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - oncopharma_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncopharma -d oncopharma_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  oncopharma_pg_dev:
