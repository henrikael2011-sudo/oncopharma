name: Quality — Synthetic DEV
on:
  push:
  pull_request:
jobs:
  unit-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:extended
      - run: npm run check:design
      - run: npm run check:brand
      - run: npm run check:governance
      - run: npm run build
      - run: npm run test:api:security
      - run: npm run test:rules
      - run: npm run test:readiness
      - run: npm run test:lab:e2e
      - name: Generate validation evidence (unit runner; integration reported separately)
        run: npm run validate:evidence
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oncopharma-synthetic-test-evidence
          path: artifacts/validation/
          if-no-files-found: ignore
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oncopharma_dev
          POSTGRES_USER: oncopharma
          POSTGRES_PASSWORD: ${{ secrets.ONCO_CI_DB_ADMIN_PASSWORD }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oncopharma -d oncopharma_dev" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations and provision least-privilege role
        run: bash infra/scripts/bootstrap-ci-db.sh
        env:
          DATABASE_URL_ADMIN: postgres://oncopharma:${{ secrets.ONCO_CI_DB_ADMIN_PASSWORD }}@localhost:5432/oncopharma_dev
          APP_DB_PASSWORD: ${{ secrets.ONCO_CI_DB_APP_PASSWORD }}
          NODE_ENV: test
      - name: Verify PostgreSQL RLS with runtime role (fail closed)
        run: npm run test:db:required
        env:
          DATABASE_URL: postgres://oncopharma_app:${{ secrets.ONCO_CI_DB_APP_PASSWORD }}@localhost:5432/oncopharma_dev
          # M14.5: somente para criar fixtures sintéticas dos testes negativos (banco efêmero do runner).
          DATABASE_URL_ADMIN: postgres://oncopharma:${{ secrets.ONCO_CI_DB_ADMIN_PASSWORD }}@localhost:5432/oncopharma_dev
          NODE_ENV: test
      # M15.1: E2E completo (Playwright + Chrome + axe) com IdP de TESTE Keycloak efêmero; senhas geradas por execução.
      - name: Generate ephemeral E2E credentials
        run: |
          KC_PW=$(openssl rand -hex 24); E2E_PW="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::$KC_PW"; echo "::add-mask::$E2E_PW"
          echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$KC_PW" >> "$GITHUB_ENV"; echo "E2E_USER_PASSWORD=$E2E_PW" >> "$GITHUB_ENV"
      - name: Start Keycloak (test IdP)
        run: |
          docker run -d --name kc -p 8080:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KC_BOOTSTRAP_ADMIN_PASSWORD" quay.io/keycloak/keycloak:26.8.0 start-dev --http-port=8080
          for i in $(seq 1 90); do curl -fsS http://localhost:8080/realms/master/.well-known/openid-configuration >/dev/null && exit 0; sleep 2; done; docker logs kc; exit 1
      - run: npx playwright install ffmpeg
      - name: E2E Care -> Clinical -> auditoria (OIDC+PKCE+TOTP, axe)
        run: bash tests/e2e/run-e2e.sh
        env:
          DATABASE_URL: postgres://oncopharma_app:${{ secrets.ONCO_CI_DB_APP_PASSWORD }}@localhost:5432/oncopharma_dev
          DATABASE_URL_ADMIN: postgres://oncopharma:${{ secrets.ONCO_CI_DB_ADMIN_PASSWORD }}@localhost:5432/oncopharma_dev
          KC_URL: http://localhost:8080
          KC_BOOTSTRAP_ADMIN_USERNAME: ci-admin
          E2E_STATE_FILE: ${{ runner.temp }}/e2e-state.json
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oncopharma-e2e-evidence
          path: |
            artifacts/validation/screens/
            artifacts/validation/m14_5/e2e-results.json
            artifacts/validation/m14_5/e2e-evidence.json
          if-no-files-found: ignore
